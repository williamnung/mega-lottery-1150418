<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA LOTTERY 抽籤機</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
  .container { max-width: 700px; margin: 0 auto; padding: 16px; color: #1a1a1a; }
  .title { text-align: center; font-size: 26px; font-weight: 600; margin-bottom: 18px; letter-spacing: 3px; color: #1a1a1a; }
  .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #e8e8e8; border-radius: 12px; padding: 4px; }
  .mode-tab { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; color: #666; transition: all 0.2s; }
  .mode-tab.active { background: #fff; color: #1a1a1a; font-weight: 500; border: 0.5px solid #ccc; }
  .input-area { margin-bottom: 12px; background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 14px; }
  .input-area label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
  .input-area textarea { width: 100%; height: 70px; resize: none; border-radius: 8px; border: 0.5px solid #ccc; padding: 8px; font-size: 13px; font-family: inherit; background: #f9f9f9; color: #1a1a1a; }
  .input-area input[type=number] { padding: 6px 10px; border-radius: 8px; border: 0.5px solid #ccc; font-size: 14px; background: #f9f9f9; color: #1a1a1a; }
  .input-row { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label { font-size: 13px; color: #666; margin-bottom: 0; }
  .input-group .row { display: flex; align-items: center; gap: 6px; }

  .prize-panel { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .prize-panel-title { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 10px; letter-spacing: 1px; }
  .prize-rows { display: flex; flex-direction: column; gap: 8px; }
  .prize-row { display: flex; align-items: center; gap: 8px; }
  .prize-row input[type=text] { flex: 1; min-width: 80px; padding: 5px 8px; border-radius: 8px; border: 0.5px solid #ccc; font-size: 13px; font-family: inherit; background: #f9f9f9; color: #1a1a1a; }
  .prize-row input[type=number] { width: 60px; padding: 5px 8px; border-radius: 8px; border: 0.5px solid #ccc; font-size: 13px; background: #f9f9f9; color: #1a1a1a; }
  .prize-row .prize-color { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .btn-add-prize { margin-top: 8px; padding: 5px 14px; border-radius: 20px; border: 0.5px solid #ccc; background: transparent; color: #666; font-size: 13px; cursor: pointer; }
  .btn-add-prize:hover { background: #f0f0f0; }
  .btn-del-prize { padding: 3px 8px; border-radius: 6px; border: none; background: rgba(200,60,60,0.12); color: #c04040; font-size: 12px; cursor: pointer; }

  .progress-wrap { margin: 0 10px 8px; }
  .progress-bar-bg { height: 6px; background: rgba(40,60,180,0.15); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg,#3366ff,#66aaff); border-radius: 3px; transition: width 0.5s ease; }
  .progress-label { font-size: 12px; color: #8899cc; text-align: right; margin-top: 3px; }

  .machine-wrap { position: relative; width: 100%; background: #0a0a2e; border-radius: 20px; overflow: hidden; padding: 20px 10px 14px; margin-bottom: 14px; border: 2px solid #2233aa; }
  .stars-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .machine-title { text-align: center; font-size: 13px; letter-spacing: 3px; color: #88aaff; margin-bottom: 10px; text-transform: uppercase; }
  .balls-layer { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; clip-path: circle(50% at 50% 50%); }
  .ball { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); overflow: hidden; white-space: nowrap; }
  .result-area { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 60px; padding: 8px; background: rgba(0,0,60,0.4); border-radius: 12px; margin: 0 10px 8px; border: 1px solid #2233aa; }
  .result-ball { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); overflow: hidden; text-align: center; line-height: 1.2; padding: 4px; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  @keyframes popIn { from { transform: scale(0) rotate(-180deg); opacity: 0; } to { transform: scale(1) rotate(0deg); opacity: 1; } }
  .btn-row { display: flex; gap: 10px; justify-content: center; margin: 12px 0 6px; }
  .btn-draw { padding: 10px 28px; border-radius: 30px; border: none; background: linear-gradient(135deg, #1a44cc, #3366ff); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; letter-spacing: 1px; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 15px rgba(50,100,255,0.3); }
  .btn-draw:hover { transform: scale(1.04); }
  .btn-draw:active { transform: scale(0.97); }
  .btn-draw:disabled { opacity: 0.4; cursor: default; }
  .btn-reset { padding: 10px 18px; border-radius: 30px; border: 1px solid #4466cc; background: transparent; color: #88aaff; font-size: 14px; cursor: pointer; }
  .btn-reset:hover { background: rgba(100,150,255,0.1); }
  .status-text { text-align: center; font-size: 13px; color: #88aaff; min-height: 20px; margin-bottom: 4px; letter-spacing: 1px; }
  .flying-ball { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); pointer-events: none; z-index: 100; overflow: hidden; font-size: 11px; text-align: center; line-height: 1.2; padding: 4px; }
  .current-prize-badge { text-align: center; font-size: 13px; font-weight: 500; color: #ffdd88; letter-spacing: 2px; margin-bottom: 6px; min-height: 22px; }

  .outside-results { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 14px; margin-top: 4px; }
  .outside-results h3 { font-size: 14px; font-weight: 500; color: #666; margin-bottom: 10px; letter-spacing: 1px; }
  .prize-group { margin-bottom: 12px; }
  .prize-group-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #1a1a1a; display: flex; align-items: center; gap: 6px; }
  .prize-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .result-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .result-chip { padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #fff; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  .watermark { position: fixed; bottom: 10px; left: 14px; font-size: 11px; color: rgba(120,120,120,0.35); letter-spacing: 1px; pointer-events: none; z-index: 9999; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <div class="title">MEGA LOTTERY</div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-name" onclick="switchMode('name')">姓名抽籤</button>
    <button class="mode-tab" id="tab-num" onclick="switchMode('number')">號碼抽籤</button>
  </div>

  <div class="input-area" id="input-name-area">
    <label>輸入姓名（每行一個，或以逗號分隔）</label>
    <textarea id="names-input" placeholder="例如：&#10;小明&#10;小花&#10;王大成"></textarea>
  </div>

  <div class="input-area" id="input-num-area" style="display:none">
    <div class="input-row">
      <div class="input-group">
        <label>號碼範圍</label>
        <div class="row">
          <input type="number" id="num-min" value="1" min="1" style="width:80px">
          <span style="font-size:13px;color:#666">到</span>
          <input type="number" id="num-max" value="50" min="1" style="width:80px">
        </div>
      </div>
    </div>
  </div>

  <div class="prize-panel">
    <div class="prize-panel-title">🏆 獎項設定</div>
    <div class="prize-rows" id="prize-rows"></div>
    <button class="btn-add-prize" onclick="addPrizeRow()">＋ 新增獎項</button>
  </div>

  <div class="machine-wrap" id="machine-wrap">
    <div class="stars-bg" id="stars-bg"></div>
    <div class="machine-title">✦ DRAW MACHINE ✦</div>
    <div class="current-prize-badge" id="current-prize-badge"></div>

    <div style="position:relative;width:260px;height:260px;margin:0 auto" id="globe-root">
      <svg style="position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none" viewBox="0 0 260 260">
        <defs>
          <radialGradient id="globeGrad" cx="35%" cy="30%">
            <stop offset="0%" stop-color="rgba(100,150,255,0.18)"/>
            <stop offset="60%" stop-color="rgba(20,40,120,0.04)"/>
            <stop offset="100%" stop-color="rgba(10,20,80,0.3)"/>
          </radialGradient>
        </defs>
        <circle cx="130" cy="130" r="125" fill="url(#globeGrad)" stroke="#4466ff" stroke-width="2.5" opacity="0.9"/>
        <ellipse cx="130" cy="130" rx="124" ry="124" fill="none" stroke="rgba(150,180,255,0.25)" stroke-width="1"/>
        <ellipse cx="130" cy="60" rx="60" ry="18" fill="none" stroke="rgba(180,200,255,0.2)" stroke-width="1"/>
        <ellipse cx="130" cy="130" rx="124" ry="40" fill="none" stroke="rgba(100,140,255,0.12)" stroke-width="1"/>
        <circle cx="80" cy="80" r="20" fill="rgba(255,255,255,0.04)" stroke="none"/>
      </svg>
      <div class="balls-layer" id="balls-layer" style="z-index:1"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div class="result-area" id="result-area">
      <div style="font-size:13px;color:#445599;align-self:center">按下「開始抽籤」</div>
    </div>
    <div class="status-text" id="status-text"></div>
    <div class="btn-row">
      <button class="btn-draw" id="btn-draw" onclick="handleDraw()">🎱 開始抽籤</button>
      <button class="btn-reset" onclick="resetAll()">重置</button>
    </div>
  </div>

  <div class="outside-results" id="outside-results" style="display:none">
    <h3>抽籤結果</h3>
    <div id="result-groups"></div>
  </div>
</div>

<div class="watermark">Design by William Lee</div>

<script>
const BALL_COLORS = [
  ['#e63946','#c1121f'],['#f4a261','#e76f51'],['#2a9d8f','#1a7a6f'],
  ['#457b9d','#1d3557'],['#9b2226','#6a0572'],['#588157','#3a5a40'],
  ['#e9c46a','#b5883a'],['#7b2d8b','#4a1060'],['#1d6a8a','#0a3a55'],
  ['#c77dff','#7b2fff'],['#06d6a0','#0a9970'],['#ef476f','#b5173e'],
];
const PRIZE_PALETTE = ['#e63946','#f4a261','#2a9d8f','#7b2d8b','#457b9d','#588157','#e9c46a','#ef476f'];

let mode = 'name';
let pool = [], remaining = [], drawn = new Set(), globeBalls = [];
let animating = false;
let prizes = [];
let currentPrizeIndex = 0, currentPrizeDrawn = 0, sessionStarted = false;

function renderPrizeRows() {
  const c = document.getElementById('prize-rows');
  c.innerHTML = '';
  prizes.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'prize-row';
    row.innerHTML = `
      <div class="prize-color" style="background:${p.color}"></div>
      <input type="text" value="${p.name}" placeholder="獎項名稱" oninput="prizes[${i}].name=this.value" style="flex:1;min-width:80px">
      <span style="font-size:13px;color:#666;white-space:nowrap">抽出</span>
      <input type="number" value="${p.count}" min="1" max="999" oninput="prizes[${i}].count=parseInt(this.value)||1">
      <span style="font-size:13px;color:#666">人</span>
      ${prizes.length>1?`<button class="btn-del-prize" onclick="delPrize(${i})">✕</button>`:''}
    `;
    c.appendChild(row);
  });
}

function addPrizeRow() {
  const ci = prizes.length % PRIZE_PALETTE.length;
  prizes.push({ name: `第${prizes.length+1}獎`, count: 1, color: PRIZE_PALETTE[ci], results: [] });
  renderPrizeRows();
}

function delPrize(i) { prizes.splice(i,1); renderPrizeRows(); }

prizes = [
  { name:'頭獎', count:1, color:PRIZE_PALETTE[0], results:[] },
  { name:'二獎', count:2, color:PRIZE_PALETTE[1], results:[] }
];
renderPrizeRows();

function switchMode(m) {
  mode = m;
  document.getElementById('tab-name').classList.toggle('active',m==='name');
  document.getElementById('tab-num').classList.toggle('active',m==='number');
  document.getElementById('input-name-area').style.display = m==='name'?'':'none';
  document.getElementById('input-num-area').style.display = m==='number'?'':'none';
  resetAll();
}

function buildPool() {
  if(mode==='name'){
    const raw = document.getElementById('names-input').value;
    pool = [...new Set(raw.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s.length>0))];
  } else {
    const mn=parseInt(document.getElementById('num-min').value)||1;
    const mx=parseInt(document.getElementById('num-max').value)||50;
    pool=[];
    for(let i=Math.min(mn,mx);i<=Math.max(mn,mx);i++) pool.push(String(i));
  }
  remaining=[...pool]; drawn=new Set();
}

function totalPrizeCount(){ return prizes.reduce((s,p)=>s+p.count,0); }
function getCurrentPrize(){ return prizes[currentPrizeIndex]||null; }

function advancePrize(){
  while(currentPrizeIndex<prizes.length){
    if(currentPrizeDrawn<prizes[currentPrizeIndex].count) break;
    currentPrizeIndex++; currentPrizeDrawn=0;
  }
}

function updateProgressBar(){
  const total=totalPrizeCount();
  const totalDrawn=prizes.reduce((s,p)=>s+p.results.length,0);
  const pct=total>0?(totalDrawn/total*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-label').textContent=`${totalDrawn} / ${total} 已抽出`;
}

function updateCurrentPrizeBadge(){
  const p=getCurrentPrize();
  if(!p){ document.getElementById('current-prize-badge').textContent=''; return; }
  const need=p.count-currentPrizeDrawn;
  document.getElementById('current-prize-badge').textContent=`🏆 ${p.name} — 尚需抽出 ${need} 人`;
}

function makeStars(){
  const c=document.getElementById('stars-bg');
  let h='';
  for(let i=0;i<60;i++){
    const x=Math.random()*100,y=Math.random()*100,s=Math.random()*1.5+0.4,op=Math.random()*0.7+0.2;
    h+=`<div style="position:absolute;left:${x}%;top:${y}%;width:${s}px;height:${s}px;border-radius:50%;background:rgba(200,220,255,${op});animation:twinkle ${1.5+Math.random()*2}s ease-in-out infinite alternate"></div>`;
  }
  c.innerHTML=h;
}
makeStars();

const sty=document.createElement('style');
sty.textContent=`@keyframes twinkle{from{opacity:0.3}to{opacity:1}} @keyframes float{0%{transform:translate(var(--dx0),var(--dy0))}25%{transform:translate(var(--dx1),var(--dy1))}50%{transform:translate(var(--dx2),var(--dy2))}75%{transform:translate(var(--dx3),var(--dy3))}100%{transform:translate(var(--dx0),var(--dy0))}} @keyframes spin{0%{transform:rotate(0deg) translateX(var(--sr)) rotate(0deg)}100%{transform:rotate(360deg) translateX(var(--sr)) rotate(-360deg)}}`;
document.head.appendChild(sty);

function createGlobeBalls(items){
  const layer=document.getElementById('balls-layer');
  layer.innerHTML=''; globeBalls=[];
  const R=130,safe=94;
  const bSize=items.length>30?26:items.length>15?32:38;
  items.forEach((item,i)=>{
    const ci=i%BALL_COLORS.length;
    const div=document.createElement('div');
    div.className='ball';
    div.style.cssText=`width:${bSize}px;height:${bSize}px;font-size:${bSize>34?11:9}px;background:radial-gradient(circle at 35% 30%, ${BALL_COLORS[ci][0]}, ${BALL_COLORS[ci][1]})`;
    div.textContent=item.length>4?item.substring(0,4):item; div.title=item;
    const ang=Math.random()*Math.PI*2,dist=Math.random()*(safe-bSize/2);
    const cx=R+Math.cos(ang)*dist-bSize/2,cy=R+Math.sin(ang)*dist-bSize/2;
    div.style.left=cx+'px'; div.style.top=cy+'px';
    const dx=[(Math.random()-.5)*28,(Math.random()-.5)*28,(Math.random()-.5)*28,(Math.random()-.5)*28];
    const dy=[(Math.random()-.5)*28,(Math.random()-.5)*28,(Math.random()-.5)*28,(Math.random()-.5)*28];
    div.style.setProperty('--dx0',dx[0]+'px'); div.style.setProperty('--dx1',dx[1]+'px');
    div.style.setProperty('--dx2',dx[2]+'px'); div.style.setProperty('--dx3',dx[3]+'px');
    div.style.setProperty('--dy0',dy[0]+'px'); div.style.setProperty('--dy1',dy[1]+'px');
    div.style.setProperty('--dy2',dy[2]+'px'); div.style.setProperty('--dy3',dy[3]+'px');
    div.style.animation=`float ${3+Math.random()*4}s ease-in-out infinite`;
    div.style.animationDelay=(-Math.random()*4)+'s';
    layer.appendChild(div);
    globeBalls.push({el:div,item,ci,x:cx,y:cy,size:bSize,_drawn:false});
  });
}

function startSpinAnimation(){
  const cx=130,cy=130;
  globeBalls.forEach(b=>{
    if(b._drawn) return;
    b.el.style.animation='none';
    const ang=Math.random()*Math.PI*2,r=30+Math.random()*65;
    const bx=cx+Math.cos(ang)*r-b.size/2,by=cy+Math.sin(ang)*r-b.size/2;
    b.el.style.left=bx+'px'; b.el.style.top=by+'px'; b.bx=bx; b.by=by;
    b.el.style.setProperty('--sr',r+'px');
    b.el.style.transformOrigin=`${cx-bx+b.size/2}px ${cy-by+b.size/2}px`;
    const spd=0.9+Math.random()*1.4;
    b.el.style.animation=`spin ${spd}s linear infinite`;
    b.el.style.animationDirection=Math.random()>.5?'normal':'reverse';
  });
}

function stopSpinAndDraw(winners){
  const winnerBalls=[];
  winners.forEach(w=>{
    const idx=globeBalls.findIndex(b=>b.item===w&&!b._drawn);
    if(idx>=0){ globeBalls[idx]._drawn=true; winnerBalls.push(globeBalls[idx]); }
  });
  globeBalls.forEach(b=>{
    if(!b._drawn) b.el.style.animation=`float ${3+Math.random()*3}s ease-in-out infinite`;
  });
  const machineRect=document.getElementById('machine-wrap').getBoundingClientRect();
  const globeRect=document.getElementById('globe-root').getBoundingClientRect();
  const resultRect=document.getElementById('result-area').getBoundingClientRect();
  winnerBalls.forEach((wb,wi)=>{
    setTimeout(()=>{
      playSound('fly');
      const fly=document.createElement('div');
      fly.className='flying-ball';
      fly.style.cssText=`width:${wb.size}px;height:${wb.size}px;font-size:${wb.size>34?11:10}px;background:radial-gradient(circle at 35% 30%, ${BALL_COLORS[wb.ci][0]}, ${BALL_COLORS[wb.ci][1]});left:${globeRect.left-machineRect.left+wb.bx}px;top:${globeRect.top-machineRect.top+wb.by}px;transition:all 0.7s cubic-bezier(0.25,1.25,0.5,1)`;
      fly.textContent=wb.item.length>4?wb.item.substring(0,4):wb.item; fly.title=wb.item;
      document.getElementById('machine-wrap').appendChild(fly);
      wb.el.style.display='none';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        const tx=Math.min(resultRect.left-machineRect.left+wi*(wb.size+8)+8,resultRect.right-machineRect.left-wb.size-4);
        const ty=resultRect.top-machineRect.top+4;
        fly.style.left=tx+'px'; fly.style.top=ty+'px'; fly.style.transform='scale(1.15)';
        setTimeout(()=>{
          fly.remove(); addResultBallToMachine(wb.item,wb.ci);
          if(wi===winnerBalls.length-1){ playSound('success'); finishRound(winners); }
        },750);
      }));
    },wi*350);
  });
}

function addResultBallToMachine(item,ci){
  const ra=document.getElementById('result-area');
  const ph=ra.querySelector('[data-placeholder]');
  if(ph) ra.innerHTML='';
  const rb=document.createElement('div');
  rb.className='result-ball';
  rb.style.cssText=`background:radial-gradient(circle at 35% 30%, ${BALL_COLORS[ci][0]}, ${BALL_COLORS[ci][1]})`;
  rb.textContent=item.length>4?item.substring(0,4):item; rb.title=item;
  ra.appendChild(rb);
}

function finishRound(winners){
  const p=prizes[currentPrizeIndex];
  if(!p) return;
  winners.forEach(w=>{ p.results.push(w); drawn.add(w); });
  remaining=remaining.filter(r=>!drawn.has(r));
  currentPrizeDrawn+=winners.length;
  updateProgressBar(); updateOutsideResults();
  animating=false;
  if(currentPrizeDrawn>=p.count){ currentPrizeIndex++; currentPrizeDrawn=0; }
  const allDone=currentPrizeIndex>=prizes.length;
  const noMore=remaining.length===0&&!allDone;
  if(allDone){
    document.getElementById('btn-draw').textContent='全部抽完 🎉';
    document.getElementById('btn-draw').disabled=true;
    document.getElementById('status-text').textContent='所有獎項已抽完！';
    playSound('fanfare');
    document.getElementById('current-prize-badge').textContent='🎉 抽籤完成！';
  } else if(noMore){
    document.getElementById('btn-draw').textContent='人數不足';
    document.getElementById('btn-draw').disabled=true;
    document.getElementById('status-text').textContent='名單人數已用盡';
    document.getElementById('current-prize-badge').textContent='';
  } else {
    document.getElementById('btn-draw').textContent='🎱 繼續抽籤';
    document.getElementById('btn-draw').disabled=false;
    document.getElementById('status-text').textContent=`剩餘名單 ${remaining.length} 人`;
    updateCurrentPrizeBadge();
  }
}

function updateOutsideResults(){
  const el=document.getElementById('outside-results');
  const rg=document.getElementById('result-groups');
  el.style.display=''; rg.innerHTML='';
  prizes.forEach(p=>{
    if(!p.results.length) return;
    const grp=document.createElement('div');
    grp.className='prize-group';
    grp.innerHTML=`<div class="prize-group-title"><div class="prize-dot" style="background:${p.color}"></div>${p.name}（${p.results.length}/${p.count} 人）</div><div class="result-chips"></div>`;
    rg.appendChild(grp);
    const chips=grp.querySelector('.result-chips');
    p.results.forEach(r=>{
      const chip=document.createElement('div');
      chip.className='result-chip'; chip.style.background=p.color; chip.textContent=r;
      chips.appendChild(chip);
    });
  });
}

function handleDraw(){
  if(animating) return;
  if(!sessionStarted){
    buildPool();
    if(pool.length===0){ alert('請先輸入姓名或設定號碼範圍！'); return; }
    if(prizes.length===0){ alert('請至少設定一個獎項！'); return; }
    const total=totalPrizeCount();
    if(pool.length<total){ alert(`名單共 ${pool.length} 人，但獎項總計需抽 ${total} 人，人數不足！`); return; }
    prizes.forEach(p=>{ p.results=[]; });
    currentPrizeIndex=0; currentPrizeDrawn=0;
    createGlobeBalls(remaining);
    document.getElementById('result-area').innerHTML='<div data-placeholder style="font-size:13px;color:#445599;align-self:center">按下「抽籤」開始</div>';
    updateProgressBar(); updateCurrentPrizeBadge();
    sessionStarted=true;
  }
  advancePrize();
  const p=getCurrentPrize();
  if(!p){ alert('所有獎項已抽完！'); return; }
  if(remaining.length===0){ alert('名單已用盡！'); return; }
  const drawN=Math.min(1,p.count-currentPrizeDrawn,remaining.length);
  if(drawN<=0) return;
  animating=true;
  document.getElementById('btn-draw').disabled=true;
  playSound('spin');
  document.getElementById('status-text').textContent='🎰 旋轉中...';
  startSpinAnimation();
  setTimeout(()=>{
    const shuffled=[...remaining].sort(()=>Math.random()-.5);
    const winners=shuffled.slice(0,drawN);
    document.getElementById('status-text').textContent='✨ 抽出結果！';
    playSound('ping');
    stopSpinAndDraw(winners);
  },2200);
}

function resetAll(){
  animating=false; sessionStarted=false;
  pool=[]; remaining=[]; drawn=new Set(); globeBalls=[];
  currentPrizeIndex=0; currentPrizeDrawn=0;
  prizes.forEach(p=>{ p.results=[]; });
  document.getElementById('balls-layer').innerHTML='';
  document.getElementById('result-area').innerHTML='<div style="font-size:13px;color:#445599;align-self:center">按下「開始抽籤」</div>';
  document.getElementById('status-text').textContent='';
  document.getElementById('current-prize-badge').textContent='';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('progress-label').textContent='';
  document.getElementById('result-groups').innerHTML='';
  document.getElementById('outside-results').style.display='none';
  document.getElementById('btn-draw').textContent='🎱 開始抽籤';
  document.getElementById('btn-draw').disabled=false;
}

const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playSound(type){
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(type==='spin') playSpin();
    else if(type==='fly') playFly();
    else if(type==='ping') playPing();
    else if(type==='success') playSuccess();
    else if(type==='fanfare') playFanfare();
  }catch(e){}
}
function makeOsc(freq,type,gainVal,start,duration){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(gainVal,start);
  g.gain.exponentialRampToValueAtTime(0.001,start+duration);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(start); o.stop(start+duration);
}
function playSpin(){
  const t=audioCtx.currentTime;
  for(let i=0;i<8;i++) makeOsc(200+Math.random()*300,'sine',0.04,t+i*0.28,0.3);
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.max(0,1-i/d.length)*0.12;
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const filt=audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=800; filt.Q.value=2;
  const g2=audioCtx.createGain(); g2.gain.setValueAtTime(0.7,t); g2.gain.linearRampToValueAtTime(0,t+2);
  src.connect(filt); filt.connect(g2); g2.connect(audioCtx.destination); src.start(t);
}
function playFly(){ const t=audioCtx.currentTime; makeOsc(800,'sine',0.12,t,0.15); makeOsc(1200,'sine',0.08,t+0.05,0.15); }
function playPing(){ const t=audioCtx.currentTime; makeOsc(880,'sine',0.18,t,0.4); makeOsc(1320,'sine',0.10,t,0.35); makeOsc(1760,'sine',0.06,t,0.3); }
function playSuccess(){ const t=audioCtx.currentTime; [523,659,784,1047].forEach((f,i)=>makeOsc(f,'sine',0.14,t+i*0.12,0.4)); }
function playFanfare(){ const t=audioCtx.currentTime; [523,659,784,659,784,1047].forEach((f,i)=>{ makeOsc(f,'triangle',0.15,t+i*0.18,0.2); makeOsc(f*1.5,'sine',0.06,t+i*0.18,0.2); }); }
</script>
